spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2

        - id: course-service
          uri: http://course-service:8082
          predicates:
            - Path=/api/courses/**
          filters:
            - StripPrefix=2

        - id: enrollment-service
          uri: http://enrollment-service:8083
          predicates:
            - Path=/api/enrollments/**
          filters:
            - StripPrefix=2

        - id: learning-service
          uri: http://learning-service:8084
          predicates:
            - Path=/api/learning/**
          filters:
            - StripPrefix=2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://auth-service:8081/.well-known/jwks.json}

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.svh: DEBUG

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    preferIpAddress: true

